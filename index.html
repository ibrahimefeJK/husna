<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hüsna 💙🩷</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0d1b3e;
      --navy-mid: #162447;
      --navy-light: #1f4068;
      --pink: #ff6b9d;
      --pink-light: #ffb3d1;
      --pink-soft: #ffe0ee;
      --gold: #f7d794;
      --white: #fff8fc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #1f4068 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #3d0c2e 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, #0d1b3e 0%, transparent 60%),
                  var(--navy);
      z-index: 0;
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-float {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(31,64,104,0.7), rgba(13,27,62,0.9));
      border: 1px solid rgba(255,107,157,0.3);
      border-radius: 32px;
      padding: 60px 50px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(255,107,157,0.15),
        0 0 120px rgba(255,107,157,0.08),
        inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardIn 1s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-glow {
      position: absolute;
      inset: -2px;
      border-radius: 34px;
      background: linear-gradient(135deg, rgba(255,107,157,0.4), transparent 40%, rgba(255,107,157,0.2));
      z-index: -1;
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Name */
    .name {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      color: var(--pink-light);
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255,107,157,0.6);
      animation: nameGlow 2s ease-in-out infinite alternate;
    }

    @keyframes nameGlow {
      from { text-shadow: 0 0 20px rgba(255,107,157,0.4); }
      to { text-shadow: 0 0 40px rgba(255,107,157,0.9), 0 0 80px rgba(255,107,157,0.3); }
    }

    .heart-big {
      font-size: 2.5rem;
      display: inline-block;
      animation: heartBeat 1.2s ease-in-out infinite;
      margin: 16px 0;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1.1); }
      45% { transform: scale(1.25); }
      60% { transform: scale(1); }
    }

    /* Question */
    .question {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      color: var(--white);
      line-height: 1.5;
      margin: 20px 0 40px;
      font-style: italic;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .question span {
      color: var(--pink);
      font-style: normal;
      font-weight: 700;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 16px 44px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      overflow: hidden;
      letter-spacing: 1px;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .btn:hover::before { transform: translateX(0); }

    .btn-yes {
      background: linear-gradient(135deg, var(--pink), #ff4081);
      color: white;
      box-shadow: 0 8px 25px rgba(255,107,157,0.5);
    }
    .btn-yes:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 16px 40px rgba(255,107,157,0.7);
    }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      color: var(--pink-light);
      border: 1.5px solid rgba(255,107,157,0.4);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-no:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: var(--pink);
      box-shadow: 0 12px 30px rgba(255,107,157,0.3);
    }

    /* Decorative elements */
    .deco {
      position: absolute;
      pointer-events: none;
    }
    .deco-tl { top: -15px; left: -15px; font-size: 2rem; animation: spin 8s linear infinite; }
    .deco-tr { top: -15px; right: -15px; font-size: 2rem; animation: spin 8s linear infinite reverse; }
    .deco-bl { bottom: -15px; left: -15px; font-size: 1.5rem; animation: bounce 2s ease-in-out infinite; }
    .deco-br { bottom: -15px; right: -15px; font-size: 1.5rem; animation: bounce 2s ease-in-out infinite 0.5s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px;
      color: rgba(255,179,209,0.4);
      font-size: 0.8rem;
      letter-spacing: 3px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,107,157,0.3), transparent);
    }

    /* SUCCESS SCREEN */
    .success-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(135deg, var(--navy) 0%, #3d0c2e 100%);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
    }

    .success-screen.show { display: flex; }

    .success-title {
      font-family: 'Dancing Script', cursive;
      font-size: 4rem;
      color: var(--pink);
      text-shadow: 0 0 40px rgba(255,107,157,0.8);
      animation: successPop 0.8s cubic-bezier(0.34,1.56,0.64,1);
      margin-bottom: 20px;
    }

    .success-sub {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--pink-light);
      font-style: italic;
      animation: fadeInUp 1s ease 0.4s both;
      margin-bottom: 30px;
    }

    .giresunlu {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(247,215,148,0.6);
      animation: fadeInUp 1s ease 0.8s both;
      margin-bottom: 10px;
    }

    .heart-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    @keyframes successPop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      z-index: 200;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    .small-hearts {
      font-size: 3rem;
      animation: floatHearts 1s ease 1.2s both;
      letter-spacing: 10px;
    }

    @keyframes floatHearts {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="hearts-bg" id="heartsBg"></div>

<!-- MAIN CARD -->
<div class="card" id="mainCard">
  <div class="card-glow"></div>

  <div class="deco deco-tl">💫</div>
  <div class="deco deco-tr">✨</div>
  <div class="deco deco-bl">🌸</div>
  <div class="deco deco-br">🌸</div>

  <div class="name">Hüsna</div>

  <div class="heart-big" id="mainHeart">💙</div>

  <div class="divider">✦ ✦ ✦</div>

  <div class="question" id="questionText">
    Bizde kendimizin aşk dizisini yapalım mı <span>finali olmayan</span> başrolleri biz olalım ne dersin? 🩷
  </div>

  <div class="buttons" id="buttonsArea">
    <button class="btn btn-yes" onclick="handleYes()">Evet 💙</button>
    <button class="btn btn-no" id="noBtn" onclick="handleNo()">Hayır</button>
  </div>
</div>

<!-- SUCCESS SCREEN -->
<div class="success-screen" id="successScreen">
  <div class="heart-rain" id="heartRain"></div>
  <div class="success-title">Hüsna</div>
  <div class="success-sub">seni çok seviyorumm</div>
  <div class="small-hearts">💙🩷💙</div>
  <br>
  <div class="giresunlu">giresunlummmm 🖤🤍❤️</div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
    `;
    starsEl.appendChild(s);
  }

  // Floating hearts in bg
  const heartsBg = document.getElementById('heartsBg');
  const bgHearts = ['💙','🩷','💗','💖','💝'];
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = bgHearts[Math.floor(Math.random()*bgHearts.length)];
    h.style.cssText = `
      left:${Math.random()*100}%;
      font-size:${0.8+Math.random()*1.4}rem;
      animation-duration:${8+Math.random()*10}s;
      animation-delay:${Math.random()*10}s;
    `;
    heartsBg.appendChild(h);
  }

  let noCount = 0;

  function handleNo() {
    noCount++;
    const btn = document.getElementById('noBtn');
    const area = document.getElementById('buttonsArea');

    // Replace the no button with two YES buttons!
    area.innerHTML = `
      <button class="btn btn-yes" onclick="handleYes()" style="animation: cardIn 0.5s ease;">Evet 💙</button>
      <button class="btn btn-yes" onclick="handleYes()" style="animation: cardIn 0.5s ease 0.1s both; background: linear-gradient(135deg, #ff4081, #c2185b);">Evet 🩷</button>
    `;

    // Shake the question a little
    const q = document.getElementById('questionText');
    q.style.animation = 'none';
    setTimeout(() => q.style.animation = '', 10);
    q.style.color = '#ffb3d1';
  }

  function handleYes() {
    // Show success screen
    document.getElementById('successScreen').classList.add('show');
    launchConfetti();
    launchHeartRain();
  }

  function launchConfetti() {
    const colors = ['#ff6b9d','#ffb3d1','#0d1b3e','#f7d794','#ff4081','#1f4068','#ffe0ee','#ff80ab'];
    for (let i = 0; i < 160; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.cssText = `
          left:${Math.random()*100}vw;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          width:${6+Math.random()*10}px;
          height:${6+Math.random()*10}px;
          border-radius:${Math.random()>0.5?'50%':'2px'};
          animation-duration:${1.5+Math.random()*2.5}s;
          animation-delay:${Math.random()*0.5}s;
        `;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, i * 20);
    }
  }

  function launchHeartRain() {
    const rainer = document.getElementById('heartRain');
    const h = ['💙','🩷','💗','💖','💝','✨','💫','🌸'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.textContent = h[Math.floor(Math.random()*h.length)];
        el.className = 'heart-float';
        el.style.cssText = `
          position:absolute;
          left:${Math.random()*100}%;
          font-size:${1.5+Math.random()*2.5}rem;
          animation-duration:${3+Math.random()*4}s;
          animation-delay:${Math.random()*2}s;
          opacity:0;
        `;
        rainer.appendChild(el);
      }, i * 100);
    }
  }
</script>
</body>
</html>
